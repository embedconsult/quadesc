[project]
name = "bloxide-xcp-interop"
version = "0.1.0"
description = "Independent S0 XCP/SxI interoperability harness"
requires-python = ">=3.10,<3.15"
dependencies = [
  "pya2ldb @ git+https://github.com/christoph2/pyA2L.git@c19c3ad2f285d1230e334bad81eeb09cbaaa3031",
  "pyxcp @ git+https://github.com/christoph2/pyxcp.git@016cf3e44364e9cd93966d144a39d342578a0391",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
xcp-s0-interop = "xcp_s0_interop.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xcp_s0_interop"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.11.26,<0.12"
