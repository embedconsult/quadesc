[package]
name = "bloxide-calibration"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Portable validated calibration descriptors and owner transaction contracts"

[features]
default = []
std = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.145", optional = true }

[dev-dependencies]
serde_json = "1.0.145"

[workspace]
exclude = ["fixtures/independent-consumer"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
