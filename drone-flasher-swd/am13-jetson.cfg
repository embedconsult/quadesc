# AM13E230X SWD through the drone-flasher Jetson's J12 header.
# Physical pin 3 -> SoM SWDIO; physical pin 5 -> SoM SWCLK; common GND.
# Run through flash-swd.sh: these pins normally belong to I2C7.
adapter driver linuxgpiod
# Current OpenOCD uses adapter gpio; older builds use linuxgpiod_* commands.
if {[catch {adapter gpio swclk 21 -chip 1}]} {
    linuxgpiod_gpiochip 1
    linuxgpiod_swd_nums 21 22
} else {
    adapter gpio swdio 22 -chip 1
}
transport select swd
reset_config none
swd newdap am13 cpu -enable -expected-id 0x6ba02477
dap create am13.dap -chain-position am13.cpu
target create am13.cpu cortex_m -dap am13.dap
cortex_m reset_config sysresetreq
# The AM13 flash algorithm runs from SRAM. Only MAIN is exposed here.
am13.cpu configure -work-area-phys 0x20000000 -work-area-size 0x8000 -work-area-backup 0
flash bank am13.main am13 0x00000000 0 0 0 am13.cpu
# No debug servers are needed for a one-shot flash operation.
gdb_port disabled
tcl_port disabled
telnet_port disabled
