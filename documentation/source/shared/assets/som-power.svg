<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 462" role="img" aria-labelledby="title desc"><title id="title">SoM power paths</title><desc id="desc">Separate digital supply selection and external analog reference; arrows summarize connectivity, not all components.</desc><rect width="100%" height="100%" rx="12" fill="#ffffff"/><style>text{font-family:system-ui,sans-serif;fill:#272c32} .label{font-size:19px;font-weight:650} .detail{font-size:15px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#C7480D"/></marker></defs><text x="32" y="36" class="label">SoM power paths</text><rect x="32" y="58" width="856" height="64" rx="8" fill="white" stroke="#F16321"/><text x="50" y="83" class="label">Carrier +VDC → U5 TPS22950 → +5V</text><text x="50" y="106" class="detail">Regulated carrier input; do not connect +VDC to a raw battery.</text><path d="M460 123 V143" stroke="#C7480D" marker-end="url(#arrow)"/><rect x="32" y="146" width="856" height="64" rx="8" fill="white" stroke="#F16321"/><text x="50" y="171" class="label">+5V → U6 TPS7A2633 → 3.3VIN_LDO</text><text x="50" y="194" class="detail">+5V also supplies TCAN844 VCC and the termination switch supply.</text><path d="M460 211 V231" stroke="#C7480D" marker-end="url(#arrow)"/><rect x="32" y="234" width="856" height="64" rx="8" fill="white" stroke="#F16321"/><text x="50" y="259" class="label">U4 TPS2116 selects 3.3VIN_LDO or 3.3VIN_DEBUG → +3.3V</text><text x="50" y="282" class="detail">Debug input comes from J2.1. +3.3V supplies MCU VDD and transceiver VIO.</text><path d="M460 299 V319" stroke="#C7480D" marker-end="url(#arrow)"/><rect x="32" y="322" width="856" height="64" rx="8" fill="white" stroke="#F16321"/><text x="50" y="347" class="label">Carrier VAA → R5 → VREFHI</text><text x="50" y="370" class="detail">The carrier supplies VAA separately from the digital debug supply.</text></svg>