<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 462" role="img" aria-labelledby="title desc"><title id="title">AM13E SoM · reusable hardware and software layers</title><desc id="desc">Conceptual layers, not an electrical schematic. Applications select and own peripherals.</desc><rect width="100%" height="100%" rx="12" fill="#ffffff"/><style>text{font-family:system-ui,sans-serif;fill:#272c32} .label{font-size:19px;font-weight:650} .detail{font-size:15px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#C7480D"/></marker></defs><text x="32" y="36" class="label">AM13E SoM · reusable hardware and software layers</text><rect x="32" y="58" width="856" height="64" rx="8" fill="white" stroke="#F16321"/><text x="50" y="83" class="label">Carrier and external devices</text><text x="50" y="106" class="detail">Carrier power, analog reference, connectors and signal conditioning</text><path d="M460 123 V143" stroke="#C7480D" marker-end="url(#arrow)"/><rect x="32" y="146" width="856" height="64" rx="8" fill="white" stroke="#F16321"/><text x="50" y="171" class="label">Module hardware</text><text x="50" y="194" class="detail">AM13E23019 · TCAN844 · power switch, LDO and mux · debug and expansion headers</text><path d="M460 211 V231" stroke="#C7480D" marker-end="url(#arrow)"/><rect x="32" y="234" width="856" height="64" rx="8" fill="white" stroke="#F16321"/><text x="50" y="259" class="label">Peripheral ownership and mux</text><text x="50" y="282" class="detail">GPIO / ADC / PWM / UC2 I²C / UC3 SPI / UC4 UART / MCAN0</text><path d="M460 299 V319" stroke="#C7480D" marker-end="url(#arrow)"/><rect x="32" y="322" width="856" height="64" rx="8" fill="white" stroke="#F16321"/><text x="50" y="347" class="label">Your application</text><text x="50" y="370" class="detail">Select the drivers, pad mux and clocks needed by the application.</text></svg>