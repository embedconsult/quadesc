name: Schematic PDFs

on:
  pull_request:
    paths:
      - '**/*.kicad_sch'
      - '**/*.kicad_pro'
      - '**/*.kicad_sym'
      - '**/*.kicad_wks'
      - '**/sym-lib-table'
      - 'tools/schematics/**'
      - '.github/workflows/schematic-pdfs.yml'
      - '.gitattributes'
  push:
    branches: [main]
    paths:
      - '**/*.kicad_sch'
      - '**/*.kicad_pro'
      - '**/*.kicad_sym'
      - '**/*.kicad_wks'
      - '**/sym-lib-table'
      - 'tools/schematics/**'
      - '.github/workflows/schematic-pdfs.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schematic-pdfs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test export and publication safeguards
        run: python3 -m unittest discover -s tools/schematics/tests -v
      - name: Export both complete schematic hierarchies
        run: python3 tools/schematics/export_pdfs.py --output-dir build/schematic-pdfs
      - name: Save reviewable PDFs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: schematic-pdfs-${{ github.sha }}
          path: |
            build/schematic-pdfs/mainboard_schematic.pdf
            build/schematic-pdfs/som_schematic.pdf
          if-no-files-found: error
          retention-days: 7

  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: generate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download PDFs from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: schematic-pdfs-${{ github.sha }}
          path: ${{ runner.temp }}/schematic-pdfs
      - name: Refresh only tracked PDFs if schematic inputs are still current
        env:
          SOURCE_SHA: ${{ github.sha }}
          PDF_DIR: ${{ runner.temp }}/schematic-pdfs
        run: python3 tools/schematics/publish_pdfs.py --source-sha "$SOURCE_SHA" --pdf-dir "$PDF_DIR"
